name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Validasi kurikulum (siklus prasyarat, referensi, derivasi) dan hasilkan ulang data
      - name: Validasi dan bangun data kurikulum
        run: python3 -I curriculum/tools/build.py
      - name: Salin data ke aplikasi web
        run: cp curriculum/data/knowledge_graph.json curriculum/data/equations.json web/src/data/

      # 2. Bangun aplikasi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi
        working-directory: web
        run: npm ci
      - name: Uji dan periksa tipe
        working-directory: web
        run: |
          npm test
          npx tsc --noEmit
      - name: Tentukan base path
        run: |
          # Repo "nama.github.io" dilayani di akar; repo lain di /nama-repo
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV" ;;
            *)           echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
